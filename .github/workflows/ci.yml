name: UniCore CI Pipeline

on:
  push:
    branches: [ main, virus, zebra ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify with Maven
        run: mvn clean verify -B --no-transfer-progress

      - name: Run Quality Gate Checks
        run: mvn javadoc:javadoc -B --no-transfer-progress
